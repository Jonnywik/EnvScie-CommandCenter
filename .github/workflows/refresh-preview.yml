name: Refresh sanitized README preview

on:
  workflow_dispatch:
    inputs:
      commit_result:
        description: Commit the rebuilt GIF to main after it is generated
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild animated preview from the sanitized static frame
        working-directory: frontend
        run: node scripts/refresh-preview.mjs
      - name: Upload regenerated preview
        uses: actions/upload-artifact@v4
        with:
          name: command-center-preview
          path: docs/assets/command-center-preview.gif
      - name: Commit regenerated preview when requested
        if: inputs.commit_result == true
        run: |
          if git diff --quiet -- docs/assets/command-center-preview.gif; then
            echo "Preview is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/command-center-preview.gif
          git commit -m "docs: refresh animated command center preview"
          git push
