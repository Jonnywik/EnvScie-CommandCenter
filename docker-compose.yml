services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cfr
      POSTGRES_USER: cfr
      POSTGRES_PASSWORD: cfr
    ports:
      - "5432:5432"
    volumes:
      - cfr_postgis_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfr -d cfr"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  cfr_postgis_data:
